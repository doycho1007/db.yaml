apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongodb-logs-nfs-pv
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 10.120.0.140
    path: /data/mongodb-logs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-logs-nfs-pvc
  namespace: db
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Gi
  volumeName: mongodb-logs-nfs-pv
